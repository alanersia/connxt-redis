[package]
name = "connxt-redis"
version = "0.1.0"
edition = "2024"
description = "A native synchronous and asynchronous Redis TCP client"
license = "MIT"
repository = "https://github.com/alanersia/connxt-redis"
readme = "README.md"
keywords = ["redis", "redis-client", "resp", "async", "tls"]
categories = ["database-implementations"]

[features]
default = []
tokio = ["dep:tokio"]
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"], optional = true }
rustls = { version = "0.23", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
